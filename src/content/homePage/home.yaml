livingPicksLabel: 课程体系
livingPicksTitle: 围绕学员幸福感打造的课程与服务
livingPicksBody: 帮助你丰富生活、提高综合素质、找到更好的工作、在公司里升职加薪。
livingPicksCategories:
  - id: career-planning
    name: 职业规划与求职
    description: 从了解自己到顺利入职，一对一陪伴式求职辅导。
    mainImage: /assets/images/cat-career.webp
    products:
      - name: 职业规划与一对一咨询
        description: 人格心理学与职业规划课程，性格、价值观、能力、职业兴趣测试与解读。
      - name: 意向企业岗位分析
        description: 一对一分析意向企业、岗位与职位，更了解应聘的公司与岗位。
      - name: 简历完善与修饰
        description: 提炼工作经验与能力，制作精美的线上与纸质简历。
      - name: 面试攻略
        description: 从穿着、表达、行为细节入手，在压力下更好地发挥。
      - name: 试用期生存指南
        description: 帮助你在试用期适应公司、相处同事领导，顺利转正。
  - id: skills
    name: 职业技能提升
    description: 面向升职加薪所需能力的系统训练。
    mainImage: /assets/images/cat-skills.webp
    products:
      - name: 基础素质能力
        description: 基础办公软件、口头表达、倾听能力等职场基础能力。
      - name: 综合素质能力
        description: 协作能力、目标管理、说服能力、谈判能力等。
      - name: 专业知识技能
        description: 语言类、平面设计、文案策划、电商运营、财务报表分析等方向。
  - id: exam
    name: 应试辅导
    description: 成人学历与职业资格考试辅导。
    mainImage: /assets/images/cat-exam.webp
    products:
      - name: 成人高考辅导
      - name: 自考辅导
      - name: 会计师
      - name: 教师资格证
      - name: 建造师、消防工程师、监理工程师
  - id: interest
    name: 兴趣拓展课
    description: 丰富生活的文化兴趣课程。
    mainImage: /assets/images/cat-interest.webp
    products:
      - name: 手绘、书法、插花
      - name: 茶艺、陶艺
      - name: 运动类、舞蹈类
aboutLabel: 品牌故事
aboutTitle: 弘扬终身学习观，提升学员幸福感
aboutBody: 硕学教育成立于 2012 年，前身是 2008 年 5 月创办的助才网。"硕学"取自"硕学通儒"，意为做读书人。我们相信学习可以改变命运，帮助在职学员找到更好的工作、升职加薪。全体伙伴奉行"不断学习、快乐奋斗、精诚合作、乐于助人"的价值观，立志做教育界和企业界的桥梁，为社会培养输送高素质、高学历人才。
ctaLabel: 加入硕学
ctaTitle: 梦想属于奋斗的人
ctaBody: 无论你处在职业发展的哪个阶段，硕学教育都愿意和你一起努力，打造属于自己的理想生活。欢迎到各分校咨询课程与报名事宜。
ctaPrimaryLabel: 浏览课程与服务
ctaPrimaryHref: /products
ctaSecondaryLabel: 了解硕学
ctaSecondaryHref: /about
brandTimelineTitle: 发展历程
brandTimeline:
  - date: '2008'
    title: 缘起助才网
    description: 2008 年 5 月，创始人创办"助才网"，取"帮助人成才"之意，这是"学习改变命运"理念的萌芽。
  - date: '2012'
    title: 硕学创校
    description: 经江东区教育局审批开设第一家校区，首年招生 950 名学员，"硕学"商标成功注册。
  - date: '2013'
    title: 扎根高校合作
    description: 新开北仑报名点，成为浙江师范大学指定宁波唯一函授点、浙江农林大学指定宁波教学点，并获评浙农林"校外合作办学进步单位"。
  - date: '2014 - 2017'
    title: 布局宁波各区县
    description: 在宁波各区县陆续开设校区，学历提升渠道拓展至成考夜大、自考、国开、远程教育等多种方式。
  - date: '2017 - 2024'
    title: 高校合作深化
    description: 成为浙江师范大学、浙江农林大学、浙江海洋大学、金华职业技术大学、浙江国际海运职业技术学院等高校的直属教学点，获评浙江师范大学"优秀函授站"、浙江农林大学唯一"优秀民办教学点"。
  - date: '2024 - 至今'
    title: 近万学员共同选择
    description: 在宁波在校学员近万人，会计、新媒体运营、办公软件、电商等自设面授课程深受学员喜爱。
