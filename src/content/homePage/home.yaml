showcaseLabel: 业务体系
showcaseTitle: 一站式在职终身学习服务
showcaseBody: 从学历提升到职业发展，硕学教育围绕提升学员幸福感持续完善课程与服务体系。
showcases:
  - tag: 学历教育
    title: 成人高考函授
    body: 聚焦在职人员学历提升，提供成考报考、考前辅导、教务管理等一体化函授配套服务。
    image: /assets/images/cat-exam.webp
  - tag: 学历教育
    title: 自考与开放教育
    body: 自学考试助学、成人中专、国家开放大学等多通道并行，匹配不同基础与时间安排的学员。
    image: /assets/images/product-online.webp
  - tag: 在职研究生
    title: 同等学力申硕
    body: 延伸学历层次至在职研究生，形成从中专到研究生的完整学历服务链路。
    image: /assets/images/product-zikao.webp
  - tag: 增值板块
    title: 职业技能与企业培训
    body: 面向个人学员提供考证辅导，面向企事业单位提供定制化企业内训服务。
    image: /assets/images/cat-skills.webp
