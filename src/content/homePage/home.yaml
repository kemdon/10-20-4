introTitle: 规范、稳定的继续教育支持
introBody: 自创办以来，硕学教育立足宁波，持续完善业务体系，逐步构建起覆盖多个学历层次与增值学习需求的全层次在职学习服务矩阵，依托扎根宁波的分校与接待点网络，为在职学员提供本地化的教务与学员服务。
highlights:
  - title: 全层次学历通道
    body: 从成人中专、专科、本科到同等学力申硕，横向丰富学历品类，纵向延伸学历层次，补齐不同学员的提升通道。
    image: /assets/images/cat-degree.webp
  - title: 一体化函授服务
    body: 取得省内多所公办高校函授教学点合作资质，提供成考报考、考前辅导、教务管理等一体化函授配套服务。
    image: /assets/images/highlight-tutoring.webp
  - title: 本地化教学网点
    body: 扎根宁波的教学服务网络：3 家分校、6 个接待点，深耕本地教务与学员服务。
    image: /assets/images/showcase-network.webp
  - title: 职业发展增值服务
    body: 在学历主业基础上，提供职业技能培训、考证辅导与企业内训，从单一学历招生升级为终身学习服务平台。
    image: /assets/images/highlight-career.webp
