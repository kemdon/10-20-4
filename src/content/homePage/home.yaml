heroLabel: 立足宁波 · 深耕成人继续教育
heroTitle: 一次选择，成就更好的自己
heroBody: 硕学教育为在职人员提供从中专、专科、本科到在职研究生的全层次学历提升通道，配合职业技能培训与企业内训，打造一站式在职终身学习服务平台。
