summary: 硕学教育以成人高考函授咨询为核心业务起步，已取得省内多所公办高校函授教学点合作资质，搭建线下服务网点，为学员提供成考报考、考前辅导、教务管理等一体化函授配套服务。
description: 合作高校包括浙江师范大学、浙江农林大学、宁波工程学院、浙江工商职业技术学院等。学员通过成人高考录取后，利用业余时间完成函授学习，工作学习两不误。各教学点提供从报名咨询、考前辅导到入学后教务管理的全程支持。
